project:
  name: sugarcane-agml-karnataka
  crop: sugarcane
  scientific_name: "Saccharum officinarum"
  region: Karnataka
  country: India
  dataset_source: Project-AgML
  version: 0.9.2

task:
  type: image_classification
  image_type: leaf
  backbone: efficientnet_b0

model:
  name: efficientnet_b0
  pretrained: true
  freeze_backbone: false
  dropout: 0.2
  input_size: 224

transforms:
  input_size: 224
  resize_size: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    random_resized_crop_scale: [0.85, 1.0]
    random_resized_crop_ratio: [0.9, 1.1]
    horizontal_flip_probability: 0.5
    rotation_degrees: 8
    brightness: 0.12
    contrast: 0.12
    saturation: 0.08
    hue: 0.01

training:
  seed: 42
  epochs: 30
  # Conservative starting point for an RTX 3050 with 6 GB VRAM.
  # If CUDA reports out-of-memory, retry with --batch-size 4.
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  early_stopping_patience: 7
  min_delta: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 2

dataset:
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]
  min_width: 64
  min_height: 64
  max_file_size_mb: 30

validation:
  compute_sha256: true

taxonomy:
  version: "agml-project-sugarcane-11-class-v1"
  source: "Project-AgML"
  label_status: "unverified"
  # Exact source folder labels. These are source-provided labels, not independently verified diagnoses.
  classes:
    - Banded Chlorosis
    - Brown Spot
    - BrownRust
    - Dried
    - Grassy shoot
    - Healthy
    - Pokkah Boeng
    - Sett Rot
    - Smut
    - Viral Disease
    - Yellow Leaf
