project:
  name: sugarcane-karnataka
  crop: sugarcane
  scientific_name: "Saccharum officinarum"
  region: Karnataka
  country: India
  version: 0.1.0

task:
  type: image_classification
  image_type: leaf
  backbone: efficientnet_b0

model:
  name: efficientnet_b0
  pretrained: true
  freeze_backbone: false
  dropout: 0.2
  input_size: 224

transforms:
  input_size: 224
  resize_size: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    random_resized_crop_scale: [0.85, 1.0]
    random_resized_crop_ratio: [0.9, 1.1]
    horizontal_flip_probability: 0.5
    rotation_degrees: 8
    brightness: 0.12
    contrast: 0.12
    saturation: 0.08
    hue: 0.01

training:
  seed: 42
  epochs: 30
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  early_stopping_patience: 7
  min_delta: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 2

dataset:
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]
  min_width: 64
  min_height: 64
  max_file_size_mb: 30

validation:
  compute_sha256: true

taxonomy:
  version: "1.0.0"
  # Provisional foliar classes; confirm labels and scope against the final dataset.
  classes:
    - healthy
    - rust
    - yellow_leaf_disease
    - sugarcane_mosaic
    - cercospora_leaf_spot
    - helminthosporium_leaf_spot
