name: Feedback API tests

on:
  push:
    branches: ["main", "feature/supervised-human-feedback"]
  pull_request:

jobs:
  feedback-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run feedback API integration tests
        run: pytest -q tests/test_feedback_api.py
