<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CropCare feedback</title><style>
body{font:15px system-ui;background:#f2f6f1;color:#193526;margin:0}.top{background:#19432e;color:white;padding:24px max(20px,calc((100% - 960px)/2))}main{max-width:960px;margin:25px auto;padding:0 18px}.card{background:white;border:1px solid #dce6dc;border-radius:14px;padding:20px;margin:14px 0}h1,h2{margin:0 0 12px}label{display:block;margin:8px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #cbd8cd;border-radius:8px;width:100%;box-sizing:border-box}button{background:#216744;color:white;border:0;cursor:pointer;margin:8px 0}.tabs{display:flex;gap:8px}.tabs button{width:auto}.hidden{display:none}.item{border-top:1px solid #e4ebe4;padding:14px 0}img{max-width:220px;border-radius:8px}.muted{color:#65766a;font-size:13px}#msg{white-space:pre-wrap}
</style></head><body><header class="top"><h1>CropCare · Sugarcane</h1>Farmer corrections and expert verification</header><main>
<div class="card"><h2>Workspace access</h2><label>Role<select id="role"><option value="farmer">Farmer</option><option value="expert">Expert</option></select></label><label>User ID<input id="uid" placeholder="farmer-001"></label><label>API token<input id="token" type="password"></label><p class="muted">Server must have FARMER_API_TOKEN and EXPERT_API_TOKEN configured. Tokens are not saved.</p></div>
<div class="tabs"><button onclick="show('farmer')">Farmer</button><button onclick="show('expert')">Expert</button></div>
<section id="farmer"><div class="card"><h2>Analyze a leaf</h2><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><button onclick="predict()">Run prediction</button><div id="result"></div></div><div class="card"><h2>My submissions</h2><button onclick="mine()">Refresh</button><div id="mine"></div></div></section>
<section id="expert" class="hidden"><div class="card"><h2>Pending expert reviews</h2><button onclick="queue()">Load queue</button><div id="queue"></div><button onclick="exportCsv()">Download verified feedback CSV</button></div></section><p id="msg" class="muted"></p></main>
<script>
const $=x=>document.getElementById(x);let current=null;const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function show(x){$('farmer').classList.toggle('hidden',x!=='farmer');$('expert').classList.toggle('hidden',x!=='expert');$('role').value=x}
function hdr(){return {'Authorization':'Bearer '+$('token').value,'X-User-ID':$('uid').value}}
async function api(url,options={}){let r=await fetch(url,{...options,headers:{...hdr(),...(options.headers||{})}});if(!r.ok)throw Error((await r.text()).slice(0,400));return r}
function message(x){$('msg').textContent=x}
async function predict(){try{let f=$('photo').files[0];if(!f)throw Error('Choose an image');let d=new FormData();d.append('image',f);current=await(await api('/api/predictions',{method:'POST',body:d})).json();let labels=['Banded Chlorosis','Brown Spot','BrownRust','Dried','Grassy shoot','Healthy','Pokkah Boeng','Sett Rot','Smut','Viral Disease','Yellow Leaf'].filter(x=>x!==current.predicted_label);$('result').innerHTML='<p><b>'+esc(current.predicted_label)+'</b> · '+(100*current.confidence).toFixed(1)+'% confidence</p><label>Suggested correction<select id="label">'+labels.map(x=>'<option>'+x+'</option>').join('')+'</select></label><textarea id="notes" placeholder="Optional field observations"></textarea><button onclick="correct()">Send to expert for verification</button>';message('Prediction saved. The model output is unchanged; corrections require expert approval.')}catch(e){message(e.message)}}
async function correct(){try{let r=await api('/api/predictions/'+current.id+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({suggested_label:$('label').value,notes:$('notes').value})});message(JSON.stringify(await r.json()))}catch(e){message(e.message)}}
async function mine(){try{let a=await(await api('/api/my-submissions')).json();$('mine').innerHTML=a.map(x=>'<div class="item"><b>'+esc(x.predicted_label)+'</b> · '+(x.status||'no correction')+'<div class="muted">'+x.id+'</div></div>').join('')||'No submissions.'}catch(e){message(e.message)}}
async function queue(){try{let a=await(await api('/api/expert/queue')).json();$('queue').innerHTML=a.map(x=>'<div class="item"><b>'+esc(x.predicted_label)+' → '+esc(x.suggested_label)+'</b><p class="muted">Farmer '+esc(x.farmer_id)+' · confidence '+(100*x.confidence).toFixed(1)+'%'+'</p><img id="img-'+x.feedback_id+'"><p>'+esc(x.notes)+'</p><input id="lbl-'+x.feedback_id+'" value="'+esc(x.suggested_label)+'"><textarea id="nt-'+x.feedback_id+'" placeholder="Expert notes"></textarea><button onclick="review(\''+x.feedback_id+'\',\'approve\')">Approve</button><button onclick="review(\''+x.feedback_id+'\',\'reject\')">Reject</button></div>').join('')||'No pending reviews.';for(let x of a){let r=await api('/api/expert/image/'+x.prediction_id);$('img-'+x.feedback_id).src=URL.createObjectURL(await r.blob())}}catch(e){message(e.message)}}
async function review(id,decision){try{let r=await api('/api/expert/review/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,verified_label:$('lbl-'+id).value,notes:$('nt-'+id).value})});message(JSON.stringify(await r.json()));queue()}catch(e){message(e.message)}}
async function exportCsv(){try{let r=await api('/api/expert/export.csv'),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='verified_feedback.csv';a.click();URL.revokeObjectURL(a.href)}catch(e){message(e.message)}}
</script></main></body></html>
