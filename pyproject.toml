[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "region-adaptive-crop-disease"
version = "0.4.0"
description = "Configurable crop disease dataset validation, duplicate screening, and leakage-aware splitting."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["Pillow>=10.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
crop-adaptive = "crop_adaptive.cli:main"

[tool.setuptools.packages.find]
include = ["crop_adaptive*"]
