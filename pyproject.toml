[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "region-adaptive-crop-disease"
version = "0.9.0"
description = "Configurable crop disease data curation, EfficientNet-B0 training, and regional adaptation."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["Pillow>=10.0", "PyYAML>=6.0"]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=7.0"]

[project.scripts]
crop-adaptive = "crop_adaptive.cli:main"

[tool.setuptools.packages.find]
include = ["crop_adaptive*"]
